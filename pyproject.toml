[project]
name = "bose-soundtouch-relay"
version = "0.0.3"
description = "Dual-homed mDNS + TCP relay so the Bose SoundTouch 300 is reachable from other VLANs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zeroconf>=0.132",
]

[project.scripts]
bose-soundtouch-relay = "relay.app:main"

[tool.setuptools]
packages = ["relay"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
